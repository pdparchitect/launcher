name: Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - 'internal/catalog/catalogue.json'
      - 'internal/catalog/manifests/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check
        run: make check

  linux:
    if: github.actor != 'github-actions[bot]'
    needs: check

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Build Linux desktop application
        run: make build-desktop

      - name: Verify Linux executable
        run: |
          test -x dist/launcher-desktop
          file dist/launcher-desktop
          file dist/launcher-desktop | grep --quiet 'ELF 64-bit.*x86-64'

      - name: Package Linux application
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          package_dir="dist/Agent Launcher"
          archive="Agent-Launcher-${version}-Linux-x86_64.tar.gz"

          mkdir -p "${package_dir}"
          cp dist/launcher-desktop "${package_dir}/launcher"
          cp README.md "${package_dir}/README.md"
          tar -C dist -czf "dist/${archive}" "Agent Launcher"

      - name: Upload Linux application
        uses: actions/upload-artifact@v6
        with:
          name: Agent-Launcher-Linux-x86_64
          path: dist/Agent-Launcher-*-Linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    if: github.actor != 'github-actions[bot]'
    needs: check

    # macOS 26, not 15: an app is granted the current design system only when it
    # links against the matching SDK. Built against the macOS 15 SDK the app
    # renders in legacy appearance on macOS 26 - tighter window corners, no
    # Liquid Glass - whatever the frontend does. Arm64 by default, which
    # matches the darwin/arm64 target below.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # macOS grants an app the current design system only when it links
      # against the matching SDK. Building against an older SDK renders in
      # legacy appearance on newer systems: smaller window corners, no Liquid
      # Glass. Report what we actually get so a stale runner is visible.
      - name: Report build toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          echo "SDK path: $(xcrun --show-sdk-path)"
          echo "SDK version: $(xcrun --show-sdk-version)"
          xcodebuild -showsdks 2>/dev/null | grep -i macosx || true

      - name: Build Apple silicon macOS application
        run: make build-macos

      - name: Verify macOS application bundle
        run: |
          app_path="build/bin/Launcher.app"
          executable_path="${app_path}/Contents/MacOS/launcher"

          test -d "${app_path}"
          plutil -lint "${app_path}/Contents/Info.plist"
          test "$(
            plutil -extract LSMinimumSystemVersion raw \
              "${app_path}/Contents/Info.plist"
          )" = "26.0"
          ! plutil -p "${app_path}/Contents/Info.plist" |
            grep -q UIDesignRequiresCompatibility
          codesign --verify --deep --strict "${app_path}"
          file "${executable_path}"
          test "$(find "${app_path}/Contents/MacOS" -type f | wc -l | tr -d ' ')" = "1"
          test ! -e "${app_path}/Contents/Resources/launcher"
          ! otool -L "${executable_path}" | grep -q 'LauncherNative'

          build_version="$(vtool -show-build "${executable_path}")"
          printf '%s\n' "${build_version}"
          grep -Eq 'minos[[:space:]]+26[.]0' <<<"${build_version}"
          grep -Eq 'sdk[[:space:]]+26[.]' <<<"${build_version}"

          architectures="$(lipo -archs "${executable_path}")"
          test "${architectures}" = "arm64" || {
            echo "Expected an arm64-only executable, got: ${architectures}"
            exit 1
          }

      - name: Package macOS application
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          archive="Agent-Launcher-${version}-macOS-arm64.zip"

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/bin/Launcher.app" \
            "dist/${archive}"

      - name: Upload macOS application
        uses: actions/upload-artifact@v6
        with:
          name: Agent-Launcher-macOS-arm64
          path: dist/Agent-Launcher-*-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
