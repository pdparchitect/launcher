name: Release catalogue

# The catalogue has its own release identity so presentation and application
# additions do not require a Launcher binary release. Bump catalogue.json in
# the same change as any manifest or artwork update.
on:
  push:
    branches:
      - main
    paths:
      - 'internal/catalog/catalogue.json'
      - 'internal/catalog/manifests/**'

permissions:
  contents: write

concurrency:
  group: catalogue-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate catalogue
        run: go test ./internal/catalog

      - name: Resolve release identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(jq -er '.version' internal/catalog/catalogue.json)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Catalogue version is not semantic versioning: $version" >&2
            exit 1
          fi
          tag="catalogue-v${version}"

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            tagged_sha="$(git rev-list -n 1 "$tag")"
            if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
              echo "$tag already belongs to $tagged_sha." >&2
              echo "Bump internal/catalog/catalogue.json for this change." >&2
              exit 1
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}"
          fi

          release=true
          if gh release view "$tag" >/dev/null 2>&1; then
            release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Package catalogue
        if: steps.identity.outputs.release == 'true'
        run: |
          mkdir -p dist
          (
            cd internal/catalog
            zip -X -q -r ../../dist/launcher-catalogue.zip \
              catalogue.json manifests
          )

      - name: Create catalogue release
        if: steps.identity.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.identity.outputs.tag }}
          name: Catalogue ${{ steps.identity.outputs.version }}
          body: |
            Versioned application catalogue for Launcher.

            The bundle contains the complete manifest and artwork snapshot.
            Launcher validates the release asset digest and all catalogue
            contents before activating it.
          files: dist/launcher-catalogue.zip
          prerelease: ${{ contains(steps.identity.outputs.version, '-') }}
          make_latest: false
