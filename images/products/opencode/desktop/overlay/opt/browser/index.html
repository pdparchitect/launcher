<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCode</title>
    <style>
      :root { color-scheme: dark; background: #131010; color: #f2eded; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #131010;
      }
      svg { width: min(42vw, 300px); height: auto; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 300 300" role="img" aria-label="OpenCode">
      <g transform="translate(30)">
        <path d="M180 240H60V120h120v120Z" fill="#4A4545"/>
        <path fill-rule="evenodd" d="M180 60H60v180h120V60Zm60 240H0V0h240v300Z" fill="#F2EDED"/>
      </g>
    </svg>
  </body>
</html>
