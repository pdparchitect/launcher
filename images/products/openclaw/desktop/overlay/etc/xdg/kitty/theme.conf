# OpenClaw Desktop terminal palette.
#
# Included from the kitty.conf the desktop base generates on every session
# start, which is why this is a separate file rather than a kitty.conf here.
#
# The greys and the two accents are OpenClaw's own design tokens, taken from
# openclaw.ai's dark theme:
#
#   #101012  ink 950, page      #F5654A  coral, accent
#   #19191C  ink 900, surface   #E05540  coral, hovered
#   #202024  ink 850, elevated  #B23A28  coral, deep
#   #EDEDED  ink 50, text       #4FC8AE  sea, secondary accent
#   #BCBCC4  ink 300, secondary #2FA48D  sea, deep
#   #9A9AA2  ink 500, muted
#
# The brand has no yellow, blue or magenta, and a terminal needs all three. The
# three below are the only invented colours in this image: desaturated to sit
# with the ink greys rather than compete with the two accents.
#
# The ground is the other exception, and a deliberate one. #300A24 is Ubuntu's
# aubergine - the terminal every published screenshot of OpenClaw onboarding is
# taken in, and the colour the wizard is recognised by. It is not one of
# OpenClaw's design tokens, and the rest of this desktop stays on the ink greys,
# so the terminal reads as a terminal sitting on the product rather than as part
# of the product's chrome.
#
#   #300A24  aubergine, the ground
#   #3D1330  aubergine, raised: inactive tabs, the ANSI black
#   #5A2A4A  aubergine, lifted: the unfocused border, the bright ANSI black

background            #300A24
foreground            #EDEDED
background_opacity    1.0

cursor                #F5654A
cursor_text_color     #300A24

selection_background  #F5654A
selection_foreground  #300A24

url_color             #4FC8AE

active_border_color   #F5654A
inactive_border_color #5A2A4A
bell_border_color     #E05540

active_tab_background   #F5654A
active_tab_foreground   #300A24
inactive_tab_background #3D1330
inactive_tab_foreground #9A9AA2

# The 16 ANSI colours. Red is the coral, green is the sea: OpenClaw's own
# surfaces use exactly those two for failure and for health, so TUI output and
# the desktop around it agree without anything being coordinated.

# black - follows the ground, the way Ubuntu's own palette does, so a "black"
# foreground is a shade of the terminal rather than a hole in it.
color0  #3D1330
color8  #5A2A4A
# red
color1  #E05540
color9  #F5654A
# green
color2  #2FA48D
color10 #4FC8AE
# yellow
color3  #C99A4E
color11 #E4B76A
# blue
color4  #5F86B8
color12 #86A8D4
# magenta
color5  #A07BC0
color13 #BE9CD8
# cyan
color6  #3FA5B8
color14 #6FC7D6
# white
color7  #BCBCC4
color15 #EDEDED

# The shared desktop prompt requests 256-colour slot 46 for its @user accent.
# Remap that otherwise-neon-green slot to OpenClaw coral.
color46 #F5654A
