<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!--
    Claude Code desktop ground. Composed for the margins: a terminal window
    sits over the middle of this, so the shapes are placed where they will
    still be seen and are cropped by the edges rather than centred on them.
  -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#F0EEE6"/>

  <!-- Manilla quarter disc, top left. -->
  <path d="M0 0H620A620 620 0 0 1 0 620Z" fill="#EBDBBC"/>

  <!-- Kraft disc, cropped by the bottom right corner, with an ink echo. -->
  <circle cx="1690" cy="1010" r="300" fill="#D4A27F"/>
  <circle cx="1560" cy="924" r="300" fill="none" stroke="#141413" stroke-opacity=".18" stroke-width="2"/>

  <!-- The mark, oversized and cropped by the top right corner. -->
  <g fill="#D97757">
    <path d="M1838.8 186.7L2263.4 14.5L1807.7 61.8ZM1800.1 245.2L2112.5 283L1841.4 123.2ZM1735.9 273.3L2027.1 535.4L1836.7 193.1ZM1666.7 262.4L1764.8 590.1L1794.9 249.3ZM1614.4 215.7L1479.2 624.4L1729.3 274ZM1595.6 148.2L1236.8 433.1L1660.7 259.4ZM1616.3 81.3L1306 132.9L1611 210ZM1670 36.1L1316.8 -133.3L1595.9 141.5ZM1739.5 27.2L1553 -259.7L1620.2 75.8ZM1802.8 57.2L1817.4 -373L1676.2 33.6ZM1839.8 116.7L2103.9 -257.7L1746 28.4Z"/>
    <circle cx="1720" cy="150" r="117"/>
  </g>

  <!-- A second, smaller mark low on the left, so the composition has two
       weights rather than one corner doing all the work. -->
  <g fill="#D97757" opacity=".5" transform="translate(150 730) scale(1.55)">
    <path d="M57.21 52.23L82.99 41.77L55.32 44.64ZM54.86 55.78L73.83 58.08L57.37 48.37ZM50.97 57.49L68.64 73.4L57.08 52.62ZM46.77 56.82L52.72 76.72L54.54 56.03ZM43.59 53.99L35.38 78.8L50.56 57.53ZM42.45 49.89L20.66 67.19L46.4 56.64ZM43.71 45.83L24.86 48.96L43.38 53.64ZM46.96 43.09L25.52 32.8L42.47 49.49ZM51.18 42.54L39.86 25.13L43.94 45.49ZM55.03 44.36L55.91 18.25L47.34 42.93ZM57.28 47.98L73.31 25.24L51.58 42.62Z"/>
    <circle cx="50" cy="50" r="7.11"/>
  </g>

  <!-- Paper grain. Renderers without filter support drop this and the
       wallpaper stays flat rather than breaking. -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".05"/>
</svg>
