# Claude Code terminal, set on paper rather than in a void.
#
# The base includes this file last when it generates kitty.conf, so anything
# kitty understands can be set here - not only colours.

# Paper canvas, ink text, clay cursor. Roomier padding than the base default,
# because the whole point of a light terminal is the air around the text.
background            #FAF9F5
foreground            #141413
background_opacity    1.0
window_padding_width  14

cursor                #D97757
cursor_text_color     #FAF9F5

selection_background  #EBDBBC
selection_foreground  #141413

url_color             #BF4722

active_border_color   #D97757
inactive_border_color #DDD9CC
bell_border_color     #BF4722

# ANSI, re-tuned for a light ground. The base's palette assumes black behind
# it, so the bright half is darkened rather than lightened here: on paper a
# "bright" colour has to gain contrast by getting deeper, not paler.
color0  #3D3D3A
color8  #7A7770
color1  #BF4722
color9  #A63A18
color2  #5C7A4A
color10 #46603A
color3  #B07A2A
color11 #8F6118
color4  #3F6E9E
color12 #2F587F
color5  #8A5A8C
color13 #6F446F
color6  #3E7D74
color14 #2E625B
color7  #141413
color15 #000000

# The shared desktop PS1 requests 256-colour slot 46 for its @user segment.
# Remap that otherwise-neon-green slot to clay.
color46 #D97757
