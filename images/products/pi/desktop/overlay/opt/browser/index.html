<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi</title>
    <style>
      :root {
        color-scheme: dark;
        background: #142433;
        color: #8abeb7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: auto;
        background: #142433;
      }

      pre {
        margin: 0;
        padding: 24px;
        font-family: monospace;
        font-size: clamp(32px, 9vw, 96px);
        font-weight: 700;
        line-height: 1;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <pre aria-label="Pi">
██████

████  ██

  </body>
</html>
