    <rect x="1400" y="520" width="112" height="240" fill="url(#windows)"/>
    <rect x="1528" y="608" width="88" height="152" fill="#121434"/>
    <rect x="1528" y="608" width="88" height="152" fill="url(#windows)"/>
    <rect x="408" y="440" width="8" height="40" fill="#3B3F80"/>
    <rect x="400" y="432" width="24" height="8" fill="#63E29E"/>
