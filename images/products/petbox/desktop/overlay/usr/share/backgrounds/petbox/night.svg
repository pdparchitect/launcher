<?xml version="1.0" encoding="UTF-8"?>
<!-- Night in the pen: moonlight, stars and fully awake machine towers. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"
     viewBox="0 0 1920 1080" shape-rendering="crispEdges">
  <defs>
    <pattern id="stars" width="320" height="256" patternUnits="userSpaceOnUse">
      <rect x="24" y="40" width="4" height="4" fill="#3B3F80"/>
      <rect x="152" y="16" width="4" height="4" fill="#7C84B8"/>
      <rect x="216" y="112" width="4" height="4" fill="#3B3F80"/>
