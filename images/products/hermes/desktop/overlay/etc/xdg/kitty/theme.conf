# Hermes Desktop terminal palette.
#
# Included from the kitty.conf the desktop base generates on every session
# start, which is why this is a separate file rather than a kitty.conf here.

background            #050F42
foreground            #DCE6FB
background_opacity    1.0

cursor                #3B6FE8
cursor_text_color     #050F42

selection_background  #3B6FE8
selection_foreground  #050F42

url_color             #86A9F5

active_border_color   #3B6FE8
inactive_border_color #123099
bell_border_color     #E2617A

active_tab_background   #3B6FE8
active_tab_foreground   #050F42
inactive_tab_background #050F42
inactive_tab_foreground #7B8FC4

# The 16 ANSI colours, held to the same blueprint range so TUI output does not
# fight the desktop. Hermes' setup screens use bright blue and white heavily,
# so those two carry the most weight.

# black
color0  #050F42
color8  #3A4E8C
# red
color1  #D9647E
color9  #E2617A
# green
color2  #6FBFA8
color10 #86D6BE
# yellow
color3  #C9B072
color11 #E0C88A
# blue
color4  #3B6FE8
color12 #86A9F5
# magenta
color5  #9A87D4
color13 #B3A2E6
# cyan
color6  #5FAFC9
color14 #86CBE2
# white
color7  #B6C8F0
color15 #EAF2FD
