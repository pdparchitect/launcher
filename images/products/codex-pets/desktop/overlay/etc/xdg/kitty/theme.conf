# Codex Pets terminal palette.
#
# Included from the kitty.conf the desktop base generates on every session
# start, which is why this is a separate file rather than a kitty.conf here.
#
# The same twelve colours the pets and the wallpaper are drawn from, so a
# terminal sitting on this desktop looks like part of the same cartridge.

background            #0A0B1A
foreground            #D7DCF5
background_opacity    1.0

cursor                #F5C542
cursor_text_color     #0A0B1A

selection_background  #F5C542
selection_foreground  #0A0B1A

url_color             #5AD1E8

active_border_color   #F5C542
inactive_border_color #3B3F80
bell_border_color     #E8724C

active_tab_background   #F5C542
active_tab_foreground   #0A0B1A
inactive_tab_background #121434
inactive_tab_foreground #7C84B8

# The 16 ANSI colours. Held to the pen's palette so a pet's colourway and the
# output of whatever it just ran are recognisably the same set of inks.

# black
color0  #0A0B1A
color8  #4A5080
# red
color1  #D65A48
color9  #E8724C
# green
color2  #3FBF7F
color10 #63E29E
# yellow
color3  #D9AE3A
color11 #F5C542
# blue
color4  #4A7BE8
color12 #7BA6FF
# magenta
color5  #C4569A
color13 #E86AA6
# cyan
color6  #46B3CC
color14 #5AD1E8
# white
color7  #B9C0E8
color15 #EDF0FF
