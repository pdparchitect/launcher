# Codex terminal, matched to OpenAI's own Codex artwork: a slate-navy canvas,
# white text, and one orchid accent.
#
# The base includes this file last when it generates kitty.conf, so anything
# kitty understands can be set here - not only colours.

background            #24273A
foreground            #FFFFFF
background_opacity    1.0
window_padding_width  14

cursor                #C77DEB
cursor_text_color     #24273A

selection_background  #3A3E57
selection_foreground  #FFFFFF

url_color             #7C9CFF

active_border_color   #FFFFFF
inactive_border_color #3A3E52
bell_border_color     #E5678F

# ANSI, pitched for the navy canvas rather than for black: the neutrals carry
# most of the interface and the hues stay in the artwork's blue-to-orchid
# range, so a coloured token reads as deliberate.
color0  #1D1F2E
color8  #6B7086
color1  #E5678F
color9  #F58AAA
color2  #6BD6A8
color10 #8FE6C0
color3  #E0B36A
color11 #F0C98D
color4  #7C9CFF
color12 #9DB5FF
color5  #C77DEB
color13 #D9A0F5
color6  #6FD3E0
color14 #93E3EC
color7  #C9CCD8
color15 #FFFFFF

# The shared desktop PS1 requests 256-colour slot 46 for its @user segment.
# Remap that otherwise-neon-green slot to the orchid accent.
color46 #C77DEB
